name: daily-recommend

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00) — 수집·계산·화면 배포
  workflow_dispatch: {}      # Actions 탭에서 수동 실행
  push:                      # 지역·조건·수집/모델 코드가 바뀌면 바로 다시 수집
    branches: [main]
    paths: ["config.json", "config/loan_rules.json", "collector/**", "model/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330    # 서울 전체 첫 소급 수집은 오래 걸림(끊겨도 다음 실행에서 이어받음)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 전세 실거래 수집 (아파트·빌라)
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python collector/fetch_rent.py
      - name: 매매 실거래 수집 (아파트·빌라, 활용신청 전이면 건너뜀)
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python collector/fetch_sale.py
      - name: 위치·역·인프라 (카카오)
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python collector/geo.py
      - name: 추천 계산
        run: python model/rank.py
      - name: 매매 추천 계산
        run: cd model && python rank_sale.py
      - name: 월별 예상 매물·이사 시기
        run: cd model && python supply.py
      - name: 자료 목록·수집 현황
        run: cd model && python sources.py
      - name: 화면용 설정 복사
        run: |
          cp config/notify.json web/data/notify.json
          cp config/loan_rules.json web/data/loan_rules.json
          cp config/wealth_dist.json web/data/wealth_dist.json
      - name: 데이터 커밋
        run: |
          git config user.name "jeonse-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data web/data
          git diff --cached --quiet || git commit -m "daily: $(TZ=Asia/Seoul date +%F) 실거래 갱신"
          git pull --rebase -X theirs origin main || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
