name: daily-recommend

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch:         # Actions 탭에서 수동 실행
    inputs:
      notify:
        description: "텔레그램 알림도 보내기"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 실거래 수집
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python collector/fetch_rent.py
      - name: 위치·역·인프라 (카카오)
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python collector/geo.py
      - name: 추천 계산
        run: python model/rank.py
      - name: 텔레그램 아침 알림
        if: github.event_name == 'schedule' || inputs.notify == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify/telegram.py
      - name: 데이터 커밋
        run: |
          git config user.name "jeonse-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data web/data
          git diff --cached --quiet || git commit -m "daily: $(TZ=Asia/Seoul date +%F) 실거래 갱신"
          git pull --rebase -X theirs origin main || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
