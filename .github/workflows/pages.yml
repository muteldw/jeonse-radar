name: pages-deploy

on:
  push:
    branches: [main]
    paths: ["web/**", "CHANGELOG.md", "VERSION"]   # 화면 코드·버전 기록이 바뀌면 바로 배포
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 버전·변경 기록 복사
        run: cp VERSION web/data/VERSION && cp CHANGELOG.md web/data/CHANGELOG.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
