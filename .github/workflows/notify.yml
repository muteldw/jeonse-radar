name: notify

on:
  schedule:
    - cron: "5 0-13,21-23 * * *"   # KST 06~22시 매시 5분 — config/notify.json 에 맞는 대상에게만 발송
  workflow_dispatch:
    inputs:
      force:
        description: "설정과 상관없이 켜진 대상 모두에게 지금 보내기"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 알림 발송
        env:
          FORCE_SEND: ${{ inputs.force }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_RECIPIENTS: ${{ secrets.MAIL_RECIPIENTS }}
        run: python notify/dispatch.py
      - name: 발송 기록 커밋
        run: |
          git config user.name "jeonse-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sent_log.json web/data/sent_status.json
          git diff --cached --quiet && exit 0
          git commit -m "notify: $(TZ=Asia/Seoul date '+%F %H시') 발송 기록"
          git pull --rebase -X theirs origin main || true
          git push
