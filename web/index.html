<style>
:root{--rent:#2f6fb5;--sale:#c8691c}
@media (prefers-color-scheme:dark){:root{--rent:#6ea6e6;--sale:#e89a52}}
.hero{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
#map{height:min(52vh,460px);min-height:300px}
.leaflet-container{font-family:var(--f-body);background:var(--bg)}
.mapbar{position:absolute;z-index:500;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.mapbar>*{pointer-events:auto}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg button{font:500 .8rem var(--f-body);border:0;background:none;color:var(--muted);padding:5px 11px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.fab{font:500 .8rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.fab.r{margin-left:auto}
.where{position:absolute;z-index:500;left:10px;bottom:10px;font-size:.74rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px;color:var(--muted);max-width:calc(100% - 70px)}
.pin{display:inline-block;transform:translate(-50%,-100%);white-space:nowrap;font:600 .74rem var(--f-num);color:#fff;border-radius:7px;padding:2px 6px;box-shadow:0 1px 3px rgba(0,0,0,.35);position:relative}
.pin::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:inherit}
.pin.rent{background:var(--rent);border-color:var(--rent)}.pin.sale{background:var(--sale);border-color:var(--sale)}
.pin.rent::after{border-top-color:var(--rent)}.pin.sale::after{border-top-color:var(--sale)}
.pin.hot{outline:2px solid #fff;outline-offset:0;z-index:2}
.pin b{font:700 .62rem var(--f-body);background:#fff;color:var(--bad);border-radius:4px;padding:0 3px;margin-left:4px}
.home{transform:translate(-50%,-50%);font:600 .72rem var(--f-body);background:var(--ink);color:var(--surface);border-radius:999px;padding:3px 8px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.me{width:14px;height:14px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.2);transform:translate(-50%,-50%)}
.pop{font-size:.84rem;line-height:1.5;min-width:190px}.pop h4{margin:0 0 2px;font-size:.95rem}.pop a{color:var(--accent);margin-right:8px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
@media (max-width:640px){.summary{grid-template-columns:1fr 1fr}.summary .s:first-child{grid-column:1/-1}}
.s{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0;text-decoration:none;color:inherit;display:block}
.s small{display:block;font-size:.72rem;color:var(--muted)}
.s strong{display:block;font:500 1.35rem/1.25 var(--f-num);letter-spacing:-.02em;margin:2px 0}
.s strong.up{color:var(--bad)}.s strong.down{color:var(--good)}
.s span{font-size:.76rem;color:var(--muted)}
.s:first-child strong{font-size:1.7rem;color:var(--accent)}
h2.sec{font-size:1rem;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2.sec a{font:400 .8rem var(--f-body);color:var(--accent);text-decoration:none}
.tops{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:760px){.tops{grid-template-columns:1fr}}
.tc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--rent);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;font:inherit;color:inherit}
.tc.sale{border-left-color:var(--sale)}
.tc:hover{border-color:var(--accent)}
.tc .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tc h3{margin:0;font-size:1rem;line-height:1.3}
.tc .tag{font:600 .68rem var(--f-body);color:#fff;border-radius:5px;padding:1px 6px;margin-right:4px;vertical-align:1px;background:var(--rent)}
.tc.sale .tag{background:var(--sale)}
.tc .new{font:700 .66rem var(--f-body);color:var(--bad);border:1px solid var(--bad);border-radius:5px;padding:0 5px;margin-left:4px;vertical-align:1px}
.tc .sc{font:500 1.3rem/1 var(--f-num);color:var(--accent);text-align:right}.tc .sc small{display:block;font:400 .66rem var(--f-body);color:var(--muted)}
.tc .p{font:500 1.15rem var(--f-num)}
.tc .m{font-size:.8rem;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);grid-column:1/-1;font-size:.88rem}
.legend{display:flex;gap:12px;font-size:.74rem;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
</style>
</head>

 <div class="note" id="welcome" hidden style="margin-bottom:10px">처음 오셨나요? <a href="me.html" style="color:inherit;font-weight:700">내 설정</a>에서 지금 집·이사 시점·관심 지역·예산을 넣으면 이 화면이 내 기준으로 바뀌어요. 설정은 이 기기에만 저장됩니다.</div>
 <div class="hero">
  <div id="map" role="region" aria-label="주변 추천 단지 지도"></div>
  <div class="mapbar">
   <div class="seg" role="group" aria-label="거래 종류">
    <button data-mode="both" aria-pressed="true">전체</button><button data-mode="rent" aria-pressed="false">전세</button><button data-mode="sale" aria-pressed="false">매매</button>
   </div>
   <button class="fab r" id="btn-gps">◎ 내 위치</button>
   <button class="fab" id="btn-home">⌂ 우리 집</button>
  </div>
  <div class="where" id="where">위치 확인 중…</div>
 </div>
 <div class="legend"><span><i style="background:var(--rent)"></i>전세 추천</span><span><i style="background:var(--sale)"></i>매매 추천</span><span><b style="color:var(--bad)">NEW</b> 최근 3일 안에 순위에 새로 든 단지</span><span>지도를 옮기면 그 동네 기준으로 다시 골라요</span></div>

 <div class="summary">
  <a class="s" href="timing.html" id="s-dday"><small>지금 집 전세 만기까지</small><strong>–</strong><span>&nbsp;</span></a>
  <a class="s" href="timing.html" id="s-move"><small>매물이 가장 많은 달</small><strong>–</strong><span>&nbsp;</span></a>
  <a class="s" href="stats.html" id="s-trend"><small>이 동네 전세 시세</small><strong>–</strong><span>&nbsp;</span></a>
 </div>

 <h2 class="sec"><span id="top-title">이 근처 오늘의 TOP 3</span><a href="list.html" id="more">추천 전체 보기 →</a></h2>
 <div class="tops" id="tops"><div class="empty">불러오는 중…</div></div>

 <div class="srcline" id="src"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s),e=JR.esc;
const PRO=JR.profile();
const HOME=PRO.home?{...PRO.home,name:PRO.home_name||"지금 집"}:null;
const CITY=[37.5663,126.9779];   /* 설정이 없을 때 시작점: 서울시청 */
const store={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};
const leaseEnd=()=>JR.profile().end||null;
let MODE=store.get("jr9_home_mode")||"both",RENT=[],SALE=[],META=null,STATS=null,SUPPLY=null,ME=null,pinOf={};

/* ---------- 지도 ---------- */
const map=L.map("map",{zoomControl:false,attributionControl:true}).setView(HOME?[HOME.lat,HOME.lng]:CITY,HOME?14:12);
L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
const pinLayer=L.layerGroup().addTo(map);
if(HOME)L.marker([HOME.lat,HOME.lng],{interactive:false,keyboard:false,zIndexOffset:1000,icon:L.divIcon({className:"",html:`<div class="home">⌂ ${e(HOME.name)}</div>`,iconSize:null})}).addTo(map);
let meMarker=null;

const km=(a,b,c,d)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
function inCoverage(lat,lng){if(!META)return false;return Object.values(META.sgg).some(s=>s.bbox&&lat>=s.bbox[0]-.03&&lat<=s.bbox[2]+.03&&lng>=s.bbox[1]-.03&&lng<=s.bbox[3]+.03)}
function nearestSgg(lat,lng){let best=null,bd=1e9;for(const [code,s] of Object.entries(META.sgg)){const c=s.center||(s.bbox?[(s.bbox[0]+s.bbox[2])/2,(s.bbox[1]+s.bbox[3])/2]:null);if(!c)continue;const d=km(lat,lng,c[0],c[1]);if(d<bd){bd=d;best=code}}return best}

/* 가까운 순으로 반경을 넓혀 가며 최소 개수를 채운 뒤, 점수 순 */
function nearby(list,lat,lng,min,max){
  const withD=list.map(i=>({i,d:km(lat,lng,i.lat,i.lng)}));
  for(const r of [3,5,8,12,20,40]){const c=withD.filter(x=>x.d<=r);if(c.length>=min||r===40)return {r,items:c.sort((a,b)=>b.i.score-a.i.score).slice(0,max)}}
}
const price=(it,kind)=>`${it.price_eok.toFixed(it.price_eok>=10?1:2).replace(/0$/,"")}억`;
function popup(it,kind){
  const facts=[`${it.sgg} ${it.umd}`,`전용 ${it.area_m2}㎡(${it.pyeong}평형)`,it.built?`${it.built}년`:"",it.station?`${e(it.station)}역 ${it.walk_min!=null?"도보 "+it.walk_min+"분":""}`:""].filter(Boolean).join(" · ");
  const extra=kind==="sale"&&it.jeonse_ratio?`<br>전세가율 ${Math.round(it.jeonse_ratio*100)}% · 갭 ${it.gap_eok}억`:kind==="sale"&&it.growth_1y!=null?`<br>1년 ${it.growth_1y>0?"+":""}${(it.growth_1y*100).toFixed(1)}%`:"";
  return `<div class="pop"><h4>${e(it.name)}${JR.kindLabel(it)}</h4><b>${kind==="sale"?"매매":"전세"} ${price(it)}</b> · 점수 ${it.score}<br><span class="muted">${facts}</span>${extra}<br>${JR.naverHtml(it,kind)} <a href="${kind==="sale"?"buy.html":"list.html"}?sgg=${encodeURIComponent(sggCode(it.sgg)||"")}">목록</a></div>`;
}
function sggCode(name){if(!META)return null;for(const [c,s] of Object.entries(META.sgg))if(s.name===name)return c;return null}

let SHOWN={rent:[],sale:[]},FIT=false,fitting=false;
const focusOn=(lat,lng)=>{map.setView([lat,lng],14);FIT=true;render()};
function render(){
  if(!META)return;
  const c=map.getCenter(),lat=c.lat,lng=c.lng;
  const R=MODE!=="sale"?nearby(RENT,lat,lng,6,15):{items:[],r:0};
  const S=MODE!=="rent"?nearby(SALE,lat,lng,4,10):{items:[],r:0};
  SHOWN={rent:R.items.map(x=>x.i),sale:S.items.map(x=>x.i)};
  pinLayer.clearLayers();pinOf={};
  const top=new Set(pickTop().map(x=>x.it.id+x.kind));
  for(const [kind,arr] of [["rent",SHOWN.rent],["sale",SHOWN.sale]])arr.forEach(it=>{
    const hot=top.has(it.id+kind);
    const m=L.marker([it.lat,it.lng],{title:it.name,riseOnHover:true,zIndexOffset:hot?500:0,icon:L.divIcon({className:"",html:`<span class="pin ${kind}${hot?" hot":""}">${price(it)}${it.new?"<b>NEW</b>":""}</span>`,iconSize:null})}).bindPopup(popup(it,kind),{maxWidth:280});
    m.addTo(pinLayer);pinOf[it.id+kind]=m;
  });
  renderTop();renderTrend(lat,lng);
  if(FIT){FIT=false;const pts=[...SHOWN.rent,...SHOWN.sale].slice(0,12).map(i=>[i.lat,i.lng]);
    if(pts.length){fitting=true;setTimeout(()=>fitting=false,800);map.fitBounds(L.latLngBounds([...pts,[lat,lng]]),{padding:[50,50],maxZoom:15,animate:false});}}
}

/* ---------- TOP 3 ---------- */
function pickTop(){
  const r=SHOWN.rent.map(it=>({it,kind:"rent"})),s=SHOWN.sale.map(it=>({it,kind:"sale"}));
  if(MODE==="rent")return r.slice(0,3);
  if(MODE==="sale")return s.slice(0,3);
  const out=[...r.slice(0,s.length?2:3),...s.slice(0,1)];
  return out.length<3?[...out,...r.slice(out.length,3)].slice(0,3):out;
}
function renderTop(){
  const t=pickTop();
  const code=META?nearestSgg(map.getCenter().lat,map.getCenter().lng):null;
  $("#more").href=`${MODE==="sale"?"buy.html":"list.html"}${code?"?sgg="+code:""}`;
  if(!t.length){$("#tops").innerHTML=`<div class="empty">${MODE==="sale"&&!SALE.length?"매매 실거래 자료가 아직 없어요. data.go.kr '아파트 매매 실거래가' 활용신청이 승인되면 다음 날 아침부터 표시됩니다.":"이 근처에 조건(전용 80㎡↑)에 맞는 단지가 없어요. 지도를 옮겨 보세요."}</div>`;return}
  const me=ME&&inCoverage(ME.lat,ME.lng);
  $("#tops").innerHTML=t.map(({it,kind},n)=>{
    const ref=me?ME:HOME,d=ref?km(ref.lat,ref.lng,it.lat,it.lng):null;
    return `<button class="tc ${kind}" data-k="${e(it.id+kind)}">
     <div class="hd"><h3><span class="tag">${kind==="sale"?"매매":"전세"}</span>${e(it.name)}${it.new?'<span class="new">NEW</span>':""}</h3><div class="sc">${it.score}<small>점수</small></div></div>
     <div class="p">${price(it)} <span class="m">· ${it.pyeong}평형 · ${it.built||"?"}년</span></div>
     <div class="m">${e(it.sgg)} ${e(it.umd)}${it.station?` · ${e(it.station)}역 ${it.walk_min!=null?it.walk_min+"분":""}`:""}${d==null?"":` · ${me?"내 위치":e(HOME.name)}에서 ${d<1?Math.round(d*1000)+"m":d.toFixed(1)+"km"}`}</div>
     ${kind==="sale"&&it.jeonse_ratio?`<div class="m">전세가율 ${Math.round(it.jeonse_ratio*100)}% · 갭 ${it.gap_eok}억</div>`:""}
    </button>`}).join("");
}
$("#tops").addEventListener("click",ev=>{const b=ev.target.closest(".tc");if(!b)return;const m=pinOf[b.dataset.k];if(!m)return;
  map.flyTo(m.getLatLng(),Math.max(map.getZoom(),15),{duration:.6});setTimeout(()=>m.openPopup(),650);$("#map").scrollIntoView({behavior:"smooth",block:"nearest"})});

/* ---------- 요약 카드 ---------- */
function renderDday(){
  if(!leaseEnd()){$("#s-dday").href="me.html";$("#s-dday strong").textContent="설정하기";$("#s-dday span").textContent="내 설정에서 만기일(이사 시점)을 넣어 주세요";return}
  const end=new Date(leaseEnd()+"T00:00:00"),now=new Date(),d=Math.ceil((end-now)/864e5);
  $("#s-dday strong").textContent=d>=0?`D-${d}`:`만기 ${-d}일 지남`;
  $("#s-dday span").textContent=`${HOME?HOME.name+" · ":""}${leaseEnd().replace(/-/g,".")} 만기`;
  const nx=PRO.next;if(nx&&nx.date){const g=Math.round((new Date(nx.date+"T00:00:00")-end)/864e5/30.44*10)/10;
    if(g>0){$("#s-dday").href="bridge.html";$("#s-dday span").textContent+=` · ${nx.name||"다음 집"} 입주까지 공백 ${g}개월 → 임시 거처 계획`}}
}
function renderMove(){
  if(!SUPPLY||!SUPPLY.months||!SUPPLY.region)return;
  const ym=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`,now=new Date();
  let end,fromK,label;
  if(leaseEnd()){end=leaseEnd().slice(0,7);const [y,m]=end.split("-").map(Number);fromK=ym(new Date(y,m-1-3,1));label="만기 전 3개월 중"}
  else{fromK=ym(now);end=ym(new Date(now.getFullYear(),now.getMonth()+6,1));label="앞으로 6개월 중"}
  let best=null;SUPPLY.months.forEach((mm,i)=>{if(mm>=fromK&&mm<=end){const v=SUPPLY.region.list[i];if(!best||v>best.v)best={m:mm,v}}});
  if(!best){$("#s-move strong").textContent="–";$("#s-move span").textContent="예측 범위 밖";return}
  $("#s-move strong").textContent=`${best.m.slice(2,4)}년 ${+best.m.slice(5)}월`;
  $("#s-move span").textContent=`${label} · 예상 매물 ${Math.round(best.v).toLocaleString()}건(서울·안양)`;
}
function renderTrend(lat,lng){
  if(!STATS||!META)return;
  const code=nearestSgg(lat,lng),name=META.sgg[code]?.name||"";
  const R=STATS.rent,d=R.data[code]?.["아파트"]||R.data[code]?.all;
  const el=$("#s-trend");el.href=`stats.html?scope=${code}`;
  if(!d){el.querySelector("strong").textContent="–";el.querySelector("span").textContent=name+" 자료 부족";return}
  const pv=STATS.provisional_from;let i=R.months.length-1;while(i>0&&pv&&R.months[i]>=pv)i--;
  const now=d.idx[i],ago=d.idx[i-12];
  el.querySelector("small").textContent=`${name} 전세 시세 (전년 동월 대비)`;
  const st=el.querySelector("strong");
  if(now==null||ago==null){st.textContent="–";st.className="";el.querySelector("span").textContent="비교할 자료 부족";return}
  const ch=(now/ago-1)*100;st.textContent=`${ch>0?"+":""}${ch.toFixed(1)}%`;st.className=ch>0.3?"up":ch<-0.3?"down":"";
  el.querySelector("span").textContent=`${R.months[i].replace("-",".")} 단지 보정 지수 · ${ch>0.3?"오르는 중":ch<-0.3?"내리는 중":"보합"}`;
}

/* ---------- 위치 ---------- */
function setWhere(t){$("#where").textContent=t}
function useGps(auto){
  if(!navigator.geolocation){if(!auto)setWhere("이 브라우저는 위치를 지원하지 않아요");return}
  if(!auto)setWhere("내 위치 찾는 중…");
  navigator.geolocation.getCurrentPosition(p=>{
    ME={lat:p.coords.latitude,lng:p.coords.longitude};
    if(meMarker)meMarker.remove();
    meMarker=L.marker([ME.lat,ME.lng],{interactive:false,icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:null})}).addTo(map);
    if(inCoverage(ME.lat,ME.lng)){focusOn(ME.lat,ME.lng);setWhere("내 위치 기준")}
    else{setWhere("서울·안양 밖이라 "+(auto&&store.get("jr9_home_center")?"마지막으로 본 동네":HOME?HOME.name:(PRO.areas||[]).length?"관심 지역":"서울 중심")+" 기준으로 보여드려요");if(!auto)goHome()}
    renderTop();
  },err=>{if(!auto)setWhere(err.code===1?"위치 권한이 꺼져 있어요 · 브라우저 설정에서 허용하세요":"위치를 찾지 못했어요")},{enableHighAccuracy:false,timeout:8000,maximumAge:600000});
}
function goHome(){if(!HOME){location.href="me.html";return}focusOn(HOME.lat,HOME.lng);setWhere(HOME.name+" 기준")}
$("#btn-gps").addEventListener("click",()=>useGps(false));
$("#btn-home").addEventListener("click",goHome);
document.querySelectorAll(".seg button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.mode===MODE);b.addEventListener("click",()=>{
  MODE=b.dataset.mode;store.set("jr9_home_mode",MODE);document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  $("#top-title").textContent=`이 근처 오늘의 ${MODE==="sale"?"매매 ":MODE==="rent"?"전세 ":""}TOP 3`;render()})});
let t0;map.on("moveend",()=>{if(fitting){fitting=false;return}clearTimeout(t0);t0=setTimeout(()=>{const c=map.getCenter();store.set("jr9_home_center",`${c.lat.toFixed(5)},${c.lng.toFixed(5)}`);render()},250)});
map.on("dragstart",()=>setWhere("지도 가운데 기준"));

/* ---------- 시작 ---------- */
renderDday();
const last=store.get("jr9_home_center");
if(!JR.hasProfile())$("#welcome").hidden=false;
if(!HOME)$("#btn-home").textContent="⌂ 집 설정";
let startSet=false;
if(last){const [a,b]=last.split(",").map(Number);if(a&&b){map.setView([a,b],14);setWhere("마지막으로 본 동네 기준");startSet=true}}
if(!startSet&&HOME){setWhere(HOME.name+" 기준");startSet=true}
const j=(n,f)=>fetch("data/"+n,{cache:"no-store"}).then(r=>r.ok?r.json():f).catch(()=>f);
Promise.all([JR.meta("recommend.json"),j("top_rent.json",{items:[]}),j("top_sale.json",{items:[]}),j("stats.json",null),j("supply.json",null)])
.then(([meta,r,s,st,sp])=>{
  META=meta;STATS=st;SUPPLY=sp;
  const py=JR.minPy(),br=JR.budget(meta),bs=JR.budget(meta,"sale");
  RENT=(r.items||[]).filter(i=>i.price_eok<=br+0.5&&(i.pyeong||0)>=py);SALE=(s.items||[]).filter(i=>i.price_eok<=bs+0.5&&(i.pyeong||0)>=py);
  if(!startSet){const a=(PRO.areas||[]).map(c=>meta.sgg[c]).find(x=>x&&(x.center||x.bbox));
    if(a){const c=a.center||[(a.bbox[0]+a.bbox[2])/2,(a.bbox[1]+a.bbox[3])/2];map.setView(c,14);setWhere(a.name+" 기준 (관심 지역)")}else setWhere("서울 중심 · 내 설정에서 관심 지역을 고르세요")}
  renderMove();FIT=true;render();
  $("#src").innerHTML=`실거래: 국토교통부 RTMS · ${e((meta.generated_at||"").replace("T"," ").slice(0,16))} 갱신 · 구마다 점수 상위 단지만 지도에 표시 · 지도 © OpenStreetMap · <a href="sources.html">자료 전체 보기</a>`;
  useGps(true);
}).catch(()=>{$("#tops").innerHTML='<div class="empty">자료를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</div>'});
</script>
</body>
</html>
